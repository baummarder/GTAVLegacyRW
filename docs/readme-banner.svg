    <path d="M56 241h4v-28h8v28m129 0h5v-19h6v19m178 0h4v-34h7v34m219 0h5v-25h7v25m166 0h5v-31h8v31m162 0h4v-22h7v22m165 0h5v-29h8v29" fill="#f7a26f" opacity=".55"/>
