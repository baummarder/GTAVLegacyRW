<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">GTA V Legacy for PlayStation 2</title>
  <desc id="desc">A neon sunset over a low-poly Los Santos skyline, with the words GTA V Legacy and San Andreas, PlayStation 2.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#101729"/>
      <stop offset=".52" stop-color="#3c2844"/>
      <stop offset="1" stop-color="#f06b68"/>
    </linearGradient>
    <linearGradient id="glow" x2="1" y2="0">
      <stop stop-color="#fb7583" stop-opacity=".8"/>
      <stop offset="1" stop-color="#f6b166" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#18202f"/>
      <stop offset="1" stop-color="#090e18"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 4.5h4" stroke="#fff" stroke-opacity=".055"/>
    </pattern>
  </defs>

